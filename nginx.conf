server {
    listen 80;
    server_name autobotchungkhoan.pro.vn;

    # Cho phép certbot xác thực
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect toàn bộ HTTP sang HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name autobotchungkhoan.pro.vn;

    ssl_certificate /etc/letsencrypt/live/autobotchungkhoan.pro.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autobotchungkhoan.pro.vn/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Frontend
    location / {
        proxy_pass http://stock-cms-client:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Backend API
    location /api/ {
      proxy_pass http://localhost:8000/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_redirect http:// https://;
      sub_filter "http://14.225.253.51:8000" "https://autobotchungkhoan.pro.vn/api";
      sub_filter_once off;
    }
}
