services:
    stock-cms-client:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: stock-cms-client
        expose:
            - '3000'
        env_file:
            - .env.production
        networks:
            - frontend_net

    nginx:
        image: nginx:alpine
        container_name: nginx-proxy
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - ./certbot/conf:/etc/letsencrypt:ro
            - ./certbot/www:/var/www/certbot
        depends_on:
            - stock-cms-client
        restart: unless-stopped
        networks:
            - frontend_net
            - backend_net # gắn cùng network với backend
        # Tự động reload nginx mỗi 24h để nhận chứng chỉ mới nếu có
        command: "/bin/sh -c 'while :; do sleep 24h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

    certbot:
        image: certbot/certbot
        container_name: certbot
        volumes:
            - ./certbot/conf:/etc/letsencrypt
            - ./certbot/www:/var/www/certbot
        networks:
            - frontend_net
        restart: unless-stopped
        # Kiểm tra gia hạn mỗi 12h
        entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"
        depends_on:
            - nginx

networks:
    frontend_net:
        driver: bridge
    backend_net:
        external: true
        name: autobotck_backend
